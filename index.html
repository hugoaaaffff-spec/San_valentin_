<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Marieta 💘</title>
    <style>
        /* 1. ELIMINACIÓN RADICAL DE ELEMENTOS DE BLOGGER */
        #header-wrapper, .header-outer, .sidebar-wrapper, .footer-wrapper, 
        .post-footer, .comments, #blog-pager, .status-msg-wrap, 
        .cap-top, .main-cap-top, .fauxcolumn-left-outer, .aside-container, 
        .navbar, #navbar-iframe, .ad-slot, .blog-feeds, .post-share-buttons,
        .region-inner, .main-cap-bottom, .cap-bottom, .adsbygoogle {
            display: none !important;
            visibility: hidden !important;
            height: 0 !important;
            opacity: 0 !important;
        }

        /* 2. LIMPIEZA DE LA "CAJA BLANCA" DEL POST */
        .content-inner, .main-inner, .column-center-inner, .post-body, 
        .post, .date-header, .body-fauxcolumn-outer {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        /* 3. FONDO PANTALLA COMPLETA PERSONALIZADO */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            overflow: hidden !important;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4) !important;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        /* 4. TU CARTA (FIJADA AL FRENTE) */
        .valentines-layout {
            position: fixed; 
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999999;
        }
        
        .card-v {
            background: white;
            padding: 35px 25px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            width: 90%;
            max-width: 380px;
            text-align: center;
            position: relative;
        }

        .step { display: none; opacity: 0; transition: opacity 0.5s; }
        .step.active { display: block; opacity: 1; }

        h1 { color: #e63946; font-size: 1.7rem; margin-bottom: 10px; }
        h2 { color: #e63946; margin-bottom: 15px; }
        p  { margin: 0 0 10px; }

        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 12px;
            border: 1px solid #ddd;
            outline: none;
            font-size: 1rem;
        }

        input:focus {
            border-color: #e63946;
            box-shadow: 0 0 0 2px rgba(230,57,70,0.15);
        }

        button {
            background: #e63946;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            font-size: 1rem;
        }

        .btn-area {
            position: relative;
            height: 230px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #si {
            position: absolute;
            left: 5%;
            z-index: 100;
            transition: transform 0.2s;
        }

        #no {
            position: absolute;
            right: 5%;
            background: #adb5bd;
            transition: all 0.2s;
        }
        
        .heart {
            position: absolute;
            color: #e63946;
            font-size: 20px;
            animation: fall linear forwards;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<div class="valentines-layout">
    <div class="card-v">
        <div class="step active" id="s0">
            <h1>💘 Hola Marieta...</h1>
            <p>He preparado algo para ti. ¿Quieres verlo?</p>
            <button onclick="comenzar()">Sí, ver 💌</button>
        </div>

        <div class="step" id="s1">
            <p>¿Cómo te llamas?</p>
            <input type="text" id="in-nombre" value="Marieta">
            <button onclick="irA(1, 2)">Siguiente 💌</button>
        </div>

        <div class="step" id="s2">
            <p>¿Cuánto me quieres?</p>
            <input type="text" id="in-cuanto" placeholder="Responde aquí...">
            <button onclick="irA(2, 3)">Siguiente 💖</button>
        </div>

        <div class="step" id="s3">
            <p>¿Te gusto?</p>
            <input type="text" id="in-gusto" placeholder="Sé sincera...">
            <button onclick="irA(3, 4)">Siguiente ✨</button>
        </div>

        <div class="step" id="s4">
            <h2>¿Quieres ser mi novia? 💕</h2>
            <div class="btn-area">
                <button id="si" onclick="finalizar()">¡SÍ! 💖</button>
                <!-- Botón "No" que huye también en táctiles -->
                <button id="no"
                        onmouseover="huir()"
                        ontouchstart="huir()">No 🙈</button>
            </div>
        </div>

        <div class="step" id="s5">
            <h2 style="color: #e63946;">💖 ¡Dijo que SÍ! 💖</h2>
            <p><span id="nombre-final" style="font-weight:bold;">Marieta</span>, ¡me has hecho muy feliz!</p>
        </div>
    </div>
</div>

<iframe id="musica" width="0" height="0"
        src="https://www.youtube.com/embed/b7sU7z3FcP0?enablejsapi=1"
        frameborder="0" allow="autoplay"></iframe>

<script>
    const SCRIPT_URL = "enlace "; // aquí pondrás después tu Apps Script

    let escalaSi = 1;
    let datos = { nombre: "", cuanto: "", gusto: "", acepto: "Pendiente" };

    function enviarAGoogle() {
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(datos)
        });
    }

    function comenzar() {
        const vid = document.getElementById('musica');
        vid.contentWindow.postMessage(
            '{"event":"command","func":"playVideo","args":""}',
            '*'
        );
        irA(0, 1);
    }

    function irA(actual, siguiente) {
        // Solo guardamos lo que haya escrito, sin mostrar errores
        if (actual === 1) {
            datos.nombre = document.getElementById('in-nombre').value;
        }

        if (actual === 2) {
            datos.cuanto = document.getElementById('in-cuanto').value;
        }

        if (actual === 3) {
            datos.gusto = document.getElementById('in-gusto').value;
            enviarAGoogle();
        }

        document.getElementById('s' + actual).classList.remove('active');
        document.getElementById('s' + siguiente).classList.add('active');
    }

    function huir() {
        const btnNo = document.getElementById('no');
        const btnSi = document.getElementById('si');

        const maxX = 70;
        const maxY = 150;

        btnNo.style.left = Math.random() * maxX + '%';
        btnNo.style.top  = Math.random() * maxY + 'px';

        escalaSi += 0.8;
        btnSi.style.transform = `scale(${escalaSi})`;
    }

    function finalizar() {
        datos.acepto = "¡SÍ!";
        document.getElementById('nombre-final').innerText = datos.nombre || "Marieta";
        enviarAGoogle();
        irA(4, 5);
        lluviaCorazones();
    }

    function lluviaCorazones() {
        for (let i = 0; i < 60; i++) {
            setTimeout(() => {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.className = 'heart';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 6000);
            }, i * 100);
        }
    }
</script>
</body>
</html>
